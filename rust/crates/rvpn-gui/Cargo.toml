[package]
name = "rvpn-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Radmin VPN 图形客户端（egui）：左侧分页栏 + 右键上下文菜单。"

[dependencies]
rvpn-core = { path = "../rvpn-core" }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
egui_extras = "0.29"

[[bin]]
name = "rvpnkit-gui"
path = "src/main.rs"
